spring.application.name=user-account-service
server.port=8081

#POSTGRES DATABASE CONNECTION
spring.datasource.url=jdbc:postgresql://localhost:5432/novabank_users_account_db
spring.datasource.username=postgres
spring.datasource.password=root

#JPA/Hibernate config
spring.jpa.hibernate.ddl-auto=update

# JWT config
jwt.secret=your_very_long_and_very_secure_secrete_key_for_authentication_it_should_be_at_least_64_characters_long
jwt.expiration=86400000

# Actuator Config, Health Monitoring
management.endpoints.web.exposure.include=*

#kafka config
spring.kafka.bootstrap-servers=localhost:9092

#Kafka Config as a Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


spring.kafka.producer.properties.spring.json.add.type=true

#KAFKA CONFIG AS CONSUMER
spring.kafka.consumer.group-id=account-group

#when the service is down and up again events that came in when it was down will be processed
spring.kafka.consumer.auto-offset-reset=earliest


spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=\
  com.example.transactionservice.kafka.dto.BalanceUpdateEvent:com.example.useraccountservice.kafka.dto.BalanceUpdateEvent

#EUREKA Discover
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/